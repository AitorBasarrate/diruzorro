name: diruzorro
description: App de finanzas personales - Diruzorro
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  dio: ^5.4.0
  go_router: ^17.3.0
  fl_chart: ^1.2.0
  sqflite: ^2.3.0
  path: ^1.8.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  file_picker: ^8.1.7
  csv: ^8.0.0

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.22

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.4
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  generate: true
